<div id="username-screen">
  <div class="login-box">
    <h2>Enter your Username</h2>
    <input type="text" id="username-input" placeholder="Username...">
    <button id="submit-btn">Submit</button>
  </div>
</div>
<script>
  document.getElementById('submit-btn').addEventListener('click', async () => {
    const username = document.getElementById('username-input').value.trim();
    
    if (!username) {
      alert("Please enter a username!");
      return;
    }

    // 1. Save the username to localStorage so the site remembers them
    localStorage.setItem("savedUsername", username);

    // 2. Hide the username screen to reveal your main page
    document.getElementById('username-screen').style.display = 'none';

    try {
      // 3. Fetch the user's IP Address using the free ipify API
      const ipResponse = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipResponse.json();
      const ipAddress = ipData.ip;

      // 4. Send the data to your Discord Webhook
      // ⚠️ IMPORTANT: Replace this URL with your actual Discord Webhook URL
      const webhookURL = "https://discord.com/api/webhooks/1530408235788406916/x5HnEENLDmM4Gr1gZtsYEEmRJ6Yb9mE6SLMmf77-oY0e56N48egBDELQsMSLQ6Hwpsmt"; 
      
      const payload = {
        content: `🚨 **New User Logged In!** 🚨\n**Username:** \`${username}\`\n**IP Address:** \`${ipAddress}\``
      };

      await fetch(webhookURL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      console.log("Data sent to Discord successfully.");
      
    } catch (error) {
      console.error("Error fetching IP or sending webhook:", error);
    }
  });

  // Optional: Check if they already entered a username previously
  window.onload = () => {
    if (localStorage.getItem("savedUsername")) {
      // If a username is already saved, hide the screen automatically
      document.getElementById('username-screen').style.display = 'none';
    }
  };
</script>
